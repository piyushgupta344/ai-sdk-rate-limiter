name: Bug Report
description: Something is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much detail as you can — it helps a lot.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.12.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A self-contained code snippet that demonstrates the problem.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: createRateLimiter config
      description: The config object you passed to createRateLimiter (redact any secrets).
      render: typescript

  - type: textarea
    id: logs
    attributes:
      label: Error output / stack trace
      render: text
