name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Verify package contents (smoke test)
        if: matrix.node-version == '22'
        run: |
          PACK_OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"
          echo "$PACK_OUTPUT" | grep -q "dist/index.js"     || (echo "MISSING: dist/index.js"     && exit 1)
          echo "$PACK_OUTPUT" | grep -q "dist/index.cjs"    || (echo "MISSING: dist/index.cjs"    && exit 1)
          echo "$PACK_OUTPUT" | grep -q "dist/index.d.ts"   || (echo "MISSING: dist/index.d.ts"   && exit 1)
          echo "$PACK_OUTPUT" | grep -q "dist/cli.js"       || (echo "MISSING: dist/cli.js"        && exit 1)
          echo "$PACK_OUTPUT" | grep -q "README.md"         || (echo "MISSING: README.md"          && exit 1)
          echo "$PACK_OUTPUT" | grep -q "LICENSE"           || (echo "MISSING: LICENSE"            && exit 1)
          echo "Package contents verified."
